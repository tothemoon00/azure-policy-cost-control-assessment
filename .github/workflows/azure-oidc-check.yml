name: Azure Terraform plan check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Sign in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify read-only Azure access
        run: az account show --query "{subscription:name,state:state}" --output table

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create and verify the zero-cost plan
        run: |
          terraform init -input=false
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -lock=false -out=assessment.tfplan
          terraform show -json assessment.tfplan > assessment-plan.json
          pwsh -File ./scripts/assert-zero-cost-plan.ps1 -PlanJsonPath ./assessment-plan.json
